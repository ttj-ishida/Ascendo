# Supabase local development config for Ascendo.
#
# NOTE: This file was hand-written (not generated by `supabase init`) because
# Docker Desktop / the Supabase CLI were not available in the environment that
# authored this project. Regenerate it with `supabase init` (and re-merge any
# custom settings below) the first time it's run in an environment that has
# the CLI installed, to make sure it matches the installed CLI's schema.

project_id = "ascendo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
